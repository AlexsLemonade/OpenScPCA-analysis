# This is a workflow to run the cell-type-osteosarcoma module
#
# Analysis modules are run based on three triggers:
# - Manual trigger
# - On pull requests where code in the module has changed
# - As a reusable workflow called from a separate workflow which periodically runs all modules



name: Run cell-type-osteosarcoma analysis module
env:
  MODULE_PATH: analyses/cell-type-osteosarcoma
  AWS_DEFAULT_REGION: us-east-2

concurrency:
  # only one run per branch at a time
  group: "run_cell-type-osteosarcoma_${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - analyses/cell-type-osteosarcoma/**
      - "!analyses/cell-type-osteosarcoma/Dockerfile"
      - "!analyses/cell-type-osteosarcoma/.dockerignore"
      - .github/workflows/run_cell-type-osteosarcoma.yml

jobs:
  run-module:
    if: github.repository_owner == 'AlexsLemonade'
    runs-on: ubuntu-latest
    container: public.ecr.aws/openscpca/cell-type-osteosarcoma:latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install aws-cli
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install

      - name: Download test data
        run: ./download-data.py --test-data --format SCE --projects SCPCP000017,SCPCP000018,SCPCP000023

      - name: Run analysis module
        run: |
          cd ${MODULE_PATH}
          bash run-analysis.sh
